name: Deploy to cPanel via SSH

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Upload to cPanel
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install SSH Key
        run: |
          mkdir -p ~/.ssh
          # Use printf to ensure the key has a proper trailing newline
          printf "%s\n" "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          # Add the host to known_hosts to prevent verification prompts
          ssh-keyscan -p ${{ secrets.SSH_PORT || 22 }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Test SSH Connection
        run: |
          # Added PubkeyAcceptedAlgorithms to support older RSA signatures if needed
          ssh -i ~/.ssh/id_rsa -p ${{ secrets.SSH_PORT || 22 }} \
            -o StrictHostKeyChecking=no \
            -o PubkeyAcceptedAlgorithms=+ssh-rsa \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "echo 'SSH Connection Successful!'"

      - name: Deploy via rsync
        run: |
          rsync -avz \
            -e "ssh -i ~/.ssh/id_rsa -p ${{ secrets.SSH_PORT || 22 }} -o PubkeyAcceptedAlgorithms=+ssh-rsa" \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'node_modules/' \
            --exclude 'cpanel_deploy_key*' \
            --exclude 'wp-config.php' \
            --exclude '.htaccess' \
            --exclude 'error_log' \
            --exclude 'cgi-bin/' \
            --exclude '.well-known/' \
            --exclude 'wp-content/uploads/' \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.REMOTE_PATH }}
