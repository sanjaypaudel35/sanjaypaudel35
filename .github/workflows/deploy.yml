name: Deploy to cPanel via SSH # The name of the workflow displayed in GitHub Actions

on: # Defines what events trigger this workflow
  push: # Trigger on every 'push' event
    branches: # Only for specific branches
      - main # Only run when changes are pushed or merged into the 'main' branch

jobs: # Groups together all the steps that run in the workflow
  deploy: # Unique ID for this job
    name: Upload to cPanel # Friendly name for the job displayed in the UI
    runs-on: ubuntu-latest # The type of virtual machine the job will run on

    steps: # List of tasks to be executed sequentially
      - name: Checkout Code # Descriptive name for the first step
        uses: actions/checkout@v4 # Official GitHub Action to download your repository code into the runner

      - name: Install SSH Key # Step to set up the secure connection
        run: | # Allows running multiple shell commands in one step
          mkdir -p ~/.ssh # Create the .ssh directory if it doesn't exist
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa # Copy the private key from GitHub Secrets to a file
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
        # Verify the server's identity to prevent manual prompts

      - name: Deploy via rsync # The actual deployment step
        run: | # Run the rsync command
          rsync -avz --delete \ # -a (archive), -v (verbose), -z (compress) and delete files on server not in Git
            -e "ssh -i ~/.ssh/id_rsa -p ${{ secrets.SSH_PORT || 22 }}" \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'node_modules/' \
            --exclude 'cpanel_deploy_key*' \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.REMOTE_PATH }}
