name: Deploy to cPanel via SSH

on:
  push:
    branches:
      - main

# Set environment variables for the whole workflow
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # Opt into Node.js 24 to avoid deprecation warnings

jobs:
  deploy:
    name: Upload to cPanel
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via rsync
        run: |
          # 1. Removed '--delete' to prevent wiping out files on your server that aren't in Git.
          # 2. Added more '--exclude' patterns for common cPanel/WordPress files you want to keep.
          rsync -avz \
            -e "ssh -i ~/.ssh/id_rsa -p ${{ secrets.SSH_PORT || 22 }}" \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'node_modules/' \
            --exclude 'cpanel_deploy_key*' \
            --exclude 'wp-config.php' \
            --exclude '.htaccess' \
            --exclude 'error_log' \
            --exclude 'cgi-bin/' \
            --exclude '.well-known/' \
            --exclude 'wp-content/uploads/' \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.REMOTE_PATH }}
